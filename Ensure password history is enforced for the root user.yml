---
- name: CIS 5.3.3.3.2 - Ensure password history is enforced for the root user
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Configure password history enforcement for root
      ansible.builtin.lineinfile:
        path: /etc/security/pwhistory.conf
        regexp: '^[[:space:]]*enforce_for_root\b'
        line: 'enforce_for_root'
        create: true
        owner: root
        group: root
        mode: '0644'
        backup: true

    - name: Verify enforce_for_root configuration
      ansible.builtin.shell:
        cmd: |
          grep -Pq '^[[:space:]]*enforce_for_root\b' \
            /etc/security/pwhistory.conf
      register: enforce_for_root
      changed_when: false
      failed_when: enforce_for_root.rc != 0

    - name: Assert CIS 5.3.3.3.2 compliance
      ansible.builtin.assert:
        that:
          - enforce_for_root.rc == 0
        success_msg: >-
          CIS 5.3.3.3.2 compliant -
          password history is enforced for the root user
        fail_msg: >-
          CIS 5.3.3.3.2 failed -
          enforce_for_root is not configured in /etc/security/pwhistory.conf
