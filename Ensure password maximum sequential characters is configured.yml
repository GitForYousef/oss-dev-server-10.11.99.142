---
- name: CIS 5.3.3.2.5 - Ensure password maximum sequential characters is configured
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Get active authselect profile
      ansible.builtin.shell: |
        authselect current -r | awk '{print $1}'
      register: authselect_profile
      changed_when: false

    - name: Determine authselect profile path
      ansible.builtin.set_fact:
        authselect_profile_path: >-
          {{
            '/etc/authselect/' + authselect_profile.stdout
            if authselect_profile.stdout is match('^custom/')
            else '/usr/share/authselect/default/' + authselect_profile.stdout
          }}

    - name: Display active authselect profile
      ansible.builtin.debug:
        msg: "Active authselect profile: {{ authselect_profile_path }}"

    - name: Configure maxsequence in pwquality.conf
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*maxsequence\s*='
        line: 'maxsequence = 3'
        state: present
        create: true
        owner: root
        group: root
        mode: '0644'

    - name: Configure maxsequence in pwquality.conf.d
      ansible.builtin.copy:
        dest: /etc/security/pwquality.conf.d/50-pwmaxsequence.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # CIS 5.3.3.2.5
          # Ensure password maximum sequential characters is configured
          maxsequence = 3

    - name: Remove maxsequence argument from system-auth pam_pwquality
      ansible.builtin.replace:
        path: "{{ authselect_profile_path }}/system-auth"
        regexp: '(\bpam_pwquality\.so\b[^\n#]*?)\s+maxsequence\s*=\s*\S+'
        replace: '\1'
      register: system_auth_changed

    - name: Remove maxsequence argument from password-auth pam_pwquality
      ansible.builtin.replace:
        path: "{{ authselect_profile_path }}/password-auth"
        regexp: '(\bpam_pwquality\.so\b[^\n#]*?)\s+maxsequence\s*=\s*\S+'
        replace: '\1'
      register: password_auth_changed

    - name: Apply authselect changes
      ansible.builtin.command:
        cmd: authselect apply-changes
      when:
        - system_auth_changed.changed or password_auth_changed.changed
      register: authselect_apply
      changed_when: true

    - name: Verify maxsequence configuration
      ansible.builtin.shell: |
        found=0

        if grep -RPq '^\s*maxsequence\s*=\s*[1-3]\s*(#.*)?$' \
          /etc/security/pwquality.conf \
          /etc/security/pwquality.conf.d/*.conf 2>/dev/null; then
          found=1
        fi

        if [ "$found" -eq 1 ]; then
          echo "PASS: maxsequence is configured to 3 or less"
          exit 0
        else
          echo "FAIL: maxsequence is not configured correctly"
          exit 1
        fi
      register: maxsequence_check
      changed_when: false
      failed_when: false

    - name: Verify pam_pwquality has no maxsequence argument
      ansible.builtin.shell: |
        if grep -RPi '^\s*password\s+(requisite|required|sufficient)\s+pam_pwquality\.so.*\bmaxsequence\s*=' \
          /etc/pam.d/system-auth \
          /etc/pam.d/password-auth 2>/dev/null; then
          echo "FAIL: maxsequence argument still exists in pam_pwquality"
          exit 1
        else
          echo "PASS: pam_pwquality has no maxsequence argument"
          exit 0
        fi
      register: pam_pwquality_check
      changed_when: false
      failed_when: false

    - name: Assert CIS 5.3.3.2.5 compliance
      ansible.builtin.assert:
        that:
          - maxsequence_check.rc == 0
          - pam_pwquality_check.rc == 0
        success_msg: "CIS 5.3.3.2.5 compliant - maxsequence is configured correctly"
        fail_msg: "CIS 5.3.3.2.5 failed - maxsequence configuration is not compliant"
