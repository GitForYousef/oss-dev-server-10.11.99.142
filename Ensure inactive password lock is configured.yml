---
- name: CIS 5.4.1.5 - Ensure inactive password lock is configured
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Configure default inactive password lock period
      ansible.builtin.command:
        cmd: useradd -D -f 45
      register: useradd_inactive
      changed_when: false

    - name: Find local users with passwords and invalid inactive period
      ansible.builtin.shell: |
        awk -F: '
        ($2 ~ /^\$.+\$/) && ($7 == "" || $7 > 45 || $7 < 0) {
          print $1
        }' /etc/shadow
      register: users_needing_inactive_fix
      changed_when: false

    - name: Configure inactive password lock for existing users
      ansible.builtin.command:
        cmd: "chage --inactive 45 {{ item }}"
      loop: "{{ users_needing_inactive_fix.stdout_lines }}"
      when:
        - users_needing_inactive_fix.stdout_lines | length > 0
      register: chage_inactive_result
      changed_when: true

    - name: Verify useradd inactive default
      ansible.builtin.shell: |
        useradd -D | awk -F= '$1 == "INACTIVE" {
          if ($2 >= 0 && $2 <= 45) exit 0
          else exit 1
        }'
      register: useradd_inactive_check
      changed_when: false
      failed_when: false

    - name: Verify shadow inactive password values
      ansible.builtin.shell: |
        awk -F: '
        ($2 ~ /^\$.+\$/) && ($7 == "" || $7 > 45 || $7 < 0) {
          print "Non-compliant user: " $1 " INACTIVE=" $7
          bad=1
        }
        END {
          if (bad) exit 1
          else exit 0
        }' /etc/shadow
      register: shadow_inactive_check
      changed_when: false
      failed_when: false

    - name: Assert CIS 5.4.1.5 compliance
      ansible.builtin.assert:
        that:
          - useradd_inactive_check.rc == 0
          - shadow_inactive_check.rc == 0
        success_msg: "CIS 5.4.1.5 compliant - inactive password lock is configured"
        fail_msg: "CIS 5.4.1.5 failed - inactive password lock is not configured correctly"
