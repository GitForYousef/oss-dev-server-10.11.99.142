---
- name: CIS 3.3.1.6 - Ensure net.ipv4.icmp_ignore_bogus_error_responses is configured
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Configure net.ipv4.icmp_ignore_bogus_error_responses
      ansible.builtin.copy:
        dest: /etc/sysctl.d/60-ipv4-icmp-ignore-bogus.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # CIS 3.3.1.6
          # Ensure net.ipv4.icmp_ignore_bogus_error_responses is configured
          net.ipv4.icmp_ignore_bogus_error_responses = 1

    - name: Remove broken GitLab sysctl symlink - kernel.sem
      ansible.builtin.file:
        path: /etc/sysctl.d/90-omnibus-gitlab-kernel.sem.conf
        state: absent

    - name: Remove broken GitLab sysctl symlink - kernel.shmall
      ansible.builtin.file:
        path: /etc/sysctl.d/90-omnibus-gitlab-kernel.shmall.conf
        state: absent

    - name: Remove broken GitLab sysctl symlink - kernel.shmmax
      ansible.builtin.file:
        path: /etc/sysctl.d/90-omnibus-gitlab-kernel.shmmax.conf
        state: absent

    - name: Remove broken GitLab sysctl symlink - net.core.somaxconn
      ansible.builtin.file:
        path: /etc/sysctl.d/90-omnibus-gitlab-net.core.somaxconn.conf
        state: absent

    - name: Apply icmp_ignore_bogus_error_responses setting immediately
      ansible.builtin.command:
        cmd: sysctl -w net.ipv4.icmp_ignore_bogus_error_responses=1
      changed_when: false

    - name: Verify runtime icmp_ignore_bogus_error_responses value
      ansible.builtin.command:
        cmd: sysctl -n net.ipv4.icmp_ignore_bogus_error_responses
      register: bogus_error_runtime
      changed_when: false

    - name: Verify persistent icmp_ignore_bogus_error_responses configuration
      ansible.builtin.shell: |
        grep -RniE \
          '^[[:space:]]*net\.ipv4\.icmp_ignore_bogus_error_responses[[:space:]]*=[[:space:]]*1[[:space:]]*$' \
          /etc/sysctl.conf /etc/sysctl.d/*.conf 2>/dev/null
      register: bogus_error_config
      changed_when: false
      failed_when: false

    - name: Check for incorrect icmp_ignore_bogus_error_responses values
      ansible.builtin.shell: |
        if grep -RniE \
          '^[[:space:]]*net\.ipv4\.icmp_ignore_bogus_error_responses[[:space:]]*=[[:space:]]*(0|[2-9]|1[0-9]+)[[:space:]]*$' \
          /etc/sysctl.conf /etc/sysctl.d/*.conf 2>/dev/null; then
          exit 1
        else
          exit 0
        fi
      register: bogus_error_bad
      changed_when: false
      failed_when: false

    - name: Display CIS 3.3.1.6 verification
      ansible.builtin.debug:
        msg:
          - "Runtime icmp_ignore_bogus_error_responses: {{ bogus_error_runtime.stdout | trim }}"
          - "Persistent configuration: {{ bogus_error_config.stdout_lines }}"
          - "Incorrect values detected: {{ bogus_error_bad.rc != 0 }}"

    - name: Assert CIS 3.3.1.6 compliance
      ansible.builtin.assert:
        that:
          - bogus_error_runtime.stdout | trim == "1"
          - bogus_error_config.rc == 0
          - bogus_error_config.stdout_lines | length >= 1
          - bogus_error_bad.rc == 0
        success_msg: "CIS 3.3.1.6 compliant - net.ipv4.icmp_ignore_bogus_error_responses is configured to 1"
        fail_msg: "CIS 3.3.1.6 failed - net.ipv4.icmp_ignore_bogus_error_responses requires review"
