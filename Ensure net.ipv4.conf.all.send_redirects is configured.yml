---
- name: CIS 3.3.1.4 - Ensure net.ipv4.conf.all.send_redirects is configured
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Configure net.ipv4.conf.all.send_redirects
      ansible.builtin.copy:
        dest: /etc/sysctl.d/60-ipv4-all-send-redirects.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # CIS 3.3.1.4
          # Ensure net.ipv4.conf.all.send_redirects is configured
          net.ipv4.conf.all.send_redirects = 0

    - name: Remove broken GitLab sysctl symlink - kernel.sem
      ansible.builtin.file:
        path: /etc/sysctl.d/90-omnibus-gitlab-kernel.sem.conf
        state: absent

    - name: Remove broken GitLab sysctl symlink - kernel.shmall
      ansible.builtin.file:
        path: /etc/sysctl.d/90-omnibus-gitlab-kernel.shmall.conf
        state: absent

    - name: Remove broken GitLab sysctl symlink - kernel.shmmax
      ansible.builtin.file:
        path: /etc/sysctl.d/90-omnibus-gitlab-kernel.shmmax.conf
        state: absent

    - name: Remove broken GitLab sysctl symlink - net.core.somaxconn
      ansible.builtin.file:
        path: /etc/sysctl.d/90-omnibus-gitlab-net.core.somaxconn.conf
        state: absent

    - name: Apply send_redirects setting immediately
      ansible.builtin.command:
        cmd: sysctl -w net.ipv4.conf.all.send_redirects=0
      changed_when: false

    - name: Verify runtime send_redirects value
      ansible.builtin.command:
        cmd: sysctl -n net.ipv4.conf.all.send_redirects
      register: send_redirects_runtime
      changed_when: false

    - name: Verify persistent send_redirects configuration
      ansible.builtin.shell: |
        grep -RniE \
          '^[[:space:]]*net\.ipv4\.conf\.all\.send_redirects[[:space:]]*=[[:space:]]*0[[:space:]]*$' \
          /etc/sysctl.conf /etc/sysctl.d/*.conf 2>/dev/null
      register: send_redirects_config
      changed_when: false
      failed_when: false

    - name: Check for incorrect send_redirects values
      ansible.builtin.shell: |
        if grep -RniE \
          '^[[:space:]]*net\.ipv4\.conf\.all\.send_redirects[[:space:]]*=[[:space:]]*(1|[2-9]|[1-9][0-9]+)[[:space:]]*$' \
          /etc/sysctl.conf /etc/sysctl.d/*.conf 2>/dev/null; then
          exit 1
        else
          exit 0
        fi
      register: send_redirects_bad
      changed_when: false
      failed_when: false

    - name: Display CIS 3.3.1.4 verification
      ansible.builtin.debug:
        msg:
          - "Runtime send_redirects: {{ send_redirects_runtime.stdout | trim }}"
          - "Persistent configuration: {{ send_redirects_config.stdout_lines }}"
          - "Incorrect values detected: {{ send_redirects_bad.rc != 0 }}"

    - name: Assert CIS 3.3.1.4 compliance
      ansible.builtin.assert:
        that:
          - send_redirects_runtime.stdout | trim == "0"
          - send_redirects_config.rc == 0
          - send_redirects_config.stdout_lines | length >= 1
          - send_redirects_bad.rc == 0
        success_msg: "CIS 3.3.1.4 compliant - net.ipv4.conf.all.send_redirects is configured to 0"
        fail_msg: "CIS 3.3.1.4 failed - net.ipv4.conf.all.send_redirects requires review"
