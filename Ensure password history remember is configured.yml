---
- name: CIS 5.3.3.3.1 - Ensure password history remember is configured
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Check active authselect profile
      ansible.builtin.command:
        cmd: head -1 /etc/authselect/authselect.conf
      register: authselect_profile
      changed_when: false

    - name: Extract authselect profile path
      ansible.builtin.set_fact:
        authselect_profile_path: >-
          {{
            authselect_profile.stdout
            | regex_search('custom/.*')
          }}

    - name: Fail if custom authselect profile is not detected
      ansible.builtin.assert:
        that:
          - authselect_profile_path is not none
          - authselect_profile_path | length > 0
        fail_msg: >-
          A custom authselect profile was not detected in
          /etc/authselect/authselect.conf.
          Review the active authselect profile before applying this remediation.

    - name: Configure password history remember
      ansible.builtin.lineinfile:
        path: /etc/security/pwhistory.conf
        regexp: '^[[:space:]]*remember[[:space:]]*='
        line: 'remember = 24'
        create: true
        owner: root
        group: root
        mode: '0644'
        backup: true

    - name: Remove remember argument from system-auth pam_pwhistory
      ansible.builtin.replace:
        path: "/etc/authselect/{{ authselect_profile_path }}/system-auth"
        regexp: '(^\s*password\s+(?:requisite|required|sufficient)\s+pam_pwhistory\.so.*?)(\s+remember\s*=\s*\S+)(.*$)'
        replace: '\1\3'
        backup: true

    - name: Remove remember argument from password-auth pam_pwhistory
      ansible.builtin.replace:
        path: "/etc/authselect/{{ authselect_profile_path }}/password-auth"
        regexp: '(^\s*password\s+(?:requisite|required|sufficient)\s+pam_pwhistory\.so.*?)(\s+remember\s*=\s*\S+)(.*$)'
        replace: '\1\3'
        backup: true

    - name: Apply authselect changes
      ansible.builtin.command:
        cmd: authselect apply-changes
      register: authselect_apply
      changed_when: true

    - name: Verify pwhistory remember configuration
      ansible.builtin.shell:
        cmd: |
          grep -Pq '^[[:space:]]*remember[[:space:]]*=[[:space:]]*(2[4-9]|[3-9][0-9]|[1-9][0-9]{2,})\b' \
            /etc/security/pwhistory.conf
      register: pwhistory_remember
      changed_when: false
      failed_when: pwhistory_remember.rc != 0

    - name: Verify system-auth has no remember argument
      ansible.builtin.shell:
        cmd: |
          if grep -Pq '^\s*password\s+(requisite|required|sufficient)\s+pam_pwhistory\.so.*\bremember\s*=' \
            /etc/pam.d/system-auth; then
            exit 1
          fi
      register: system_auth_remember
      changed_when: false
      failed_when: system_auth_remember.rc != 0

    - name: Verify password-auth has no remember argument
      ansible.builtin.shell:
        cmd: |
          if grep -Pq '^\s*password\s+(requisite|required|sufficient)\s+pam_pwhistory\.so.*\bremember\s*=' \
            /etc/pam.d/password-auth; then
            exit 1
          fi
      register: password_auth_remember
      changed_when: false
      failed_when: password_auth_remember.rc != 0

    - name: Assert CIS 5.3.3.3.1 compliance
      ansible.builtin.assert:
        that:
          - pwhistory_remember.rc == 0
          - system_auth_remember.rc == 0
          - password_auth_remember.rc == 0
        success_msg: >-
          CIS 5.3.3.3.1 compliant -
          password history remember is configured to 24
        fail_msg: >-
          CIS 5.3.3.3.1 failed -
          password history remember configuration is incorrect
