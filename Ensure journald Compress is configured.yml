---
- name: CIS 6.2.2.3 - Ensure journald Compress is configured
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Create journald configuration directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure journald compression
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/60-journald.conf
        content: |
          [Journal]
          Compress=yes
        owner: root
        group: root
        mode: '0644'
        backup: true
      register: journald_compress

    - name: Restart systemd-journald
      ansible.builtin.command:
        cmd: systemctl restart systemd-journald
      when: journald_compress.changed
      changed_when: true

    - name: Verify journald Compress configuration
      ansible.builtin.shell:
        cmd: |
          systemd-analyze cat-config systemd/journald.conf systemd/journald.conf.d/* 2>/dev/null | grep -E '^Compress=yes'
      register: compress_check
      changed_when: false
      failed_when: false

    - name: Display journald Compress configuration
      ansible.builtin.debug:
        msg: "{{ compress_check.stdout }}"

    - name: Assert CIS 6.2.2.3 compliance
      ansible.builtin.assert:
        that:
          - compress_check.stdout is search('^Compress=yes')
        success_msg: "CIS 6.2.2.3 compliant - journald Compress=yes is configured"
        fail_msg: "CIS 6.2.2.3 FAILED - journald Compress=yes is not configured"
