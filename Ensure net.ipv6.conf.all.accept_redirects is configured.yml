---
- name: CIS 3.3.2.3 - Ensure net.ipv6.conf.all.accept_redirects is configured
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Configure net.ipv6.conf.all.accept_redirects
      ansible.builtin.copy:
        dest: /etc/sysctl.d/60-ipv6-all-accept-redirects.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # CIS 3.3.2.3
          # Ensure net.ipv6.conf.all.accept_redirects is configured
          net.ipv6.conf.all.accept_redirects = 0

    - name: Remove broken GitLab sysctl symlink - kernel.sem
      ansible.builtin.file:
        path: /etc/sysctl.d/90-omnibus-gitlab-kernel.sem.conf
        state: absent

    - name: Remove broken GitLab sysctl symlink - kernel.shmall
      ansible.builtin.file:
        path: /etc/sysctl.d/90-omnibus-gitlab-kernel.shmall.conf
        state: absent

    - name: Remove broken GitLab sysctl symlink - kernel.shmmax
      ansible.builtin.file:
        path: /etc/sysctl.d/90-omnibus-gitlab-kernel.shmmax.conf
        state: absent

    - name: Remove broken GitLab sysctl symlink - net.core.somaxconn
      ansible.builtin.file:
        path: /etc/sysctl.d/90-omnibus-gitlab-net.core.somaxconn.conf
        state: absent

    - name: Apply IPv6 accept_redirects setting immediately
      ansible.builtin.command:
        cmd: sysctl -w net.ipv6.conf.all.accept_redirects=0
      changed_when: false

    - name: Verify runtime IPv6 accept_redirects value
      ansible.builtin.command:
        cmd: sysctl -n net.ipv6.conf.all.accept_redirects
      register: ipv6_accept_redirects_runtime
      changed_when: false

    - name: Verify persistent IPv6 accept_redirects configuration
      ansible.builtin.shell: |
        grep -RniE \
          '^[[:space:]]*net\.ipv6\.conf\.all\.accept_redirects[[:space:]]*=[[:space:]]*0[[:space:]]*$' \
          /etc/sysctl.conf /etc/sysctl.d/*.conf 2>/dev/null
      register: ipv6_accept_redirects_config
      changed_when: false
      failed_when: false

    - name: Check for incorrect IPv6 accept_redirects values
      ansible.builtin.shell: |
        if grep -RniE \
          '^[[:space:]]*net\.ipv6\.conf\.all\.accept_redirects[[:space:]]*=[[:space:]]*[1-9][0-9]*[[:space:]]*$' \
          /etc/sysctl.conf /etc/sysctl.d/*.conf 2>/dev/null; then
          exit 1
        else
          exit 0
        fi
      register: ipv6_accept_redirects_bad
      changed_when: false
      failed_when: false

    - name: Display CIS 3.3.2.3 verification
      ansible.builtin.debug:
        msg:
          - "Runtime net.ipv6.conf.all.accept_redirects: {{ ipv6_accept_redirects_runtime.stdout | trim }}"
          - "Persistent configuration: {{ ipv6_accept_redirects_config.stdout_lines }}"
          - "Incorrect values detected: {{ ipv6_accept_redirects_bad.rc != 0 }}"

    - name: Assert CIS 3.3.2.3 compliance
      ansible.builtin.assert:
        that:
          - ipv6_accept_redirects_runtime.stdout | trim == "0"
          - ipv6_accept_redirects_config.rc == 0
          - ipv6_accept_redirects_config.stdout_lines | length >= 1
          - ipv6_accept_redirects_bad.rc == 0
        success_msg: "CIS 3.3.2.3 compliant - net.ipv6.conf.all.accept_redirects is configured to 0"
        fail_msg: "CIS 3.3.2.3 failed - net.ipv6.conf.all.accept_redirects requires review"
