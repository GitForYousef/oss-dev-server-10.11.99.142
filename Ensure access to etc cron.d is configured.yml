---
- name: CIS 2.4.1.8 - Ensure access to /etc/cron.d is configured
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Check if /etc/cron.d exists
      ansible.builtin.stat:
        path: /etc/cron.d
      register: cron_d_dir

    - name: Set ownership and permissions on /etc/cron.d
      ansible.builtin.file:
        path: /etc/cron.d
        owner: root
        group: root
        mode: '0700'
      when: cron_d_dir.stat.exists
