---
- name: CIS 3.3.1.18 - Ensure net.ipv4.tcp_syncookies is configured
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Configure net.ipv4.tcp_syncookies
      ansible.builtin.copy:
        dest: /etc/sysctl.d/60-ipv4-tcp-syncookies.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # CIS 3.3.1.18
          # Ensure net.ipv4.tcp_syncookies is configured
          net.ipv4.tcp_syncookies = 1

    - name: Remove broken GitLab sysctl symlink - kernel.sem
      ansible.builtin.file:
        path: /etc/sysctl.d/90-omnibus-gitlab-kernel.sem.conf
        state: absent

    - name: Remove broken GitLab sysctl symlink - kernel.shmall
      ansible.builtin.file:
        path: /etc/sysctl.d/90-omnibus-gitlab-kernel.shmall.conf
        state: absent

    - name: Remove broken GitLab sysctl symlink - kernel.shmmax
      ansible.builtin.file:
        path: /etc/sysctl.d/90-omnibus-gitlab-kernel.shmmax.conf
        state: absent

    - name: Remove broken GitLab sysctl symlink - net.core.somaxconn
      ansible.builtin.file:
        path: /etc/sysctl.d/90-omnibus-gitlab-net.core.somaxconn.conf
        state: absent

    - name: Apply tcp_syncookies setting immediately
      ansible.builtin.command:
        cmd: sysctl -w net.ipv4.tcp_syncookies=1
      changed_when: false

    - name: Verify runtime tcp_syncookies value
      ansible.builtin.command:
        cmd: sysctl -n net.ipv4.tcp_syncookies
      register: tcp_syncookies_runtime
      changed_when: false

    - name: Verify persistent tcp_syncookies configuration
      ansible.builtin.shell: |
        grep -RniE \
          '^[[:space:]]*net\.ipv4\.tcp_syncookies[[:space:]]*=[[:space:]]*1[[:space:]]*$' \
          /etc/sysctl.conf /etc/sysctl.d/*.conf 2>/dev/null
      register: tcp_syncookies_config
      changed_when: false
      failed_when: false

    - name: Check for incorrect tcp_syncookies values
      ansible.builtin.shell: |
        if grep -RniE \
          '^[[:space:]]*net\.ipv4\.tcp_syncookies[[:space:]]*=[[:space:]]*(0|[2-9]|1[0-9]+)[[:space:]]*$' \
          /etc/sysctl.conf /etc/sysctl.d/*.conf 2>/dev/null; then
          exit 1
        else
          exit 0
        fi
      register: tcp_syncookies_bad
      changed_when: false
      failed_when: false

    - name: Display CIS 3.3.1.18 verification
      ansible.builtin.debug:
        msg:
          - "Runtime tcp_syncookies: {{ tcp_syncookies_runtime.stdout | trim }}"
          - "Persistent configuration: {{ tcp_syncookies_config.stdout_lines }}"
          - "Incorrect values detected: {{ tcp_syncookies_bad.rc != 0 }}"

    - name: Assert CIS 3.3.1.18 compliance
      ansible.builtin.assert:
        that:
          - tcp_syncookies_runtime.stdout | trim == "1"
          - tcp_syncookies_config.rc == 0
          - tcp_syncookies_config.stdout_lines | length >= 1
          - tcp_syncookies_bad.rc == 0
        success_msg: "CIS 3.3.1.18 compliant - net.ipv4.tcp_syncookies is configured to 1"
        fail_msg: "CIS 3.3.1.18 failed - net.ipv4.tcp_syncookies requires review"
