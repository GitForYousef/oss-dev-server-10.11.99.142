---
- name: CIS 1.4.1 - Ensure bootloader password is set
  hosts: all
  become: true
  gather_facts: false

  vars_prompt:

    - name: grub_password
      prompt: "Enter GRUB2 password"
      private: true
      confirm: true

  tasks:

    - name: Check grub2-setpassword command
      ansible.builtin.command:
        cmd: which grub2-setpassword
      register: grub2_setpassword_cmd
      changed_when: false

    - name: Fail if grub2-setpassword is unavailable
      ansible.builtin.fail:
        msg: "grub2-setpassword command is not available on this server."
      when: grub2_setpassword_cmd.rc != 0

    - name: Set GRUB2 bootloader password
      ansible.builtin.shell: |
        printf '%s\n%s\n' '{{ grub_password }}' '{{ grub_password }}' | grub2-setpassword
      no_log: true
      register: grub_password_result
      changed_when: true

    - name: Verify GRUB user.cfg exists
      ansible.builtin.stat:
        path: /boot/grub2/user.cfg
      register: grub_user_cfg

    - name: Verify GRUB password hash exists
      ansible.builtin.shell: |
        grep -q '^GRUB2_PASSWORD=grub.pbkdf2.sha512' /boot/grub2/user.cfg
      register: grub_password_hash
      changed_when: false
      failed_when: false

    - name: Display CIS 1.4.1 verification
      ansible.builtin.debug:
        msg:
          - "GRUB user.cfg exists: {{ grub_user_cfg.stat.exists }}"
          - "GRUB2 PBKDF2 password hash configured: {{ grub_password_hash.rc == 0 }}"

    - name: Assert CIS 1.4.1 compliance
      ansible.builtin.assert:
        that:
          - grub_user_cfg.stat.exists
          - grub_password_hash.rc == 0
        success_msg: "CIS 1.4.1 compliant - GRUB2 bootloader password is configured"
        fail_msg: "CIS 1.4.1 failed - GRUB2 bootloader password requires review"
