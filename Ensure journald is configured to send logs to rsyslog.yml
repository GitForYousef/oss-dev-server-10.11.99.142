---
- name: CIS 6.2.3.3 - Ensure journald is configured to send logs to rsyslog
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Create journald configuration directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure journald to forward logs to rsyslog
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/60-journald.conf
        content: |
          [Journal]
          Compress=yes
          Storage=persistent
          ForwardToSyslog=yes
        owner: root
        group: root
        mode: '0644'
        backup: true
      register: journald_config

    - name: Restart systemd-journald when configuration changed
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
      when: journald_config.changed

    - name: Verify effective ForwardToSyslog configuration
      ansible.builtin.shell:
        cmd: |
          systemd-analyze cat-config systemd/journald.conf systemd/journald.conf.d/* 2>/dev/null \
          | grep -E '^ForwardToSyslog=yes'
      register: forward_syslog_check
      changed_when: false
      failed_when: false

    - name: Display ForwardToSyslog configuration
      ansible.builtin.debug:
        msg: "{{ forward_syslog_check.stdout_lines }}"

    - name: Assert CIS 6.2.3.3 compliance
      ansible.builtin.assert:
        that:
          - "'ForwardToSyslog=yes' in forward_syslog_check.stdout"
        success_msg: "CIS 6.2.3.3 compliant - journald forwards logs to rsyslog"
        fail_msg: "CIS 6.2.3.3 FAILED - ForwardToSyslog=yes was not found"
