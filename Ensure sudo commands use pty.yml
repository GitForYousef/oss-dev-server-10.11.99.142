---
- name: CIS 5.2.2 - Ensure sudo commands use pty
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Remove !use_pty from /etc/sudoers
      ansible.builtin.replace:
        path: /etc/sudoers
        regexp: '^(\s*Defaults\s+[^#\n\r]*)!use_pty\b'
        replace: '\1'
        backup: true
      failed_when: false

    - name: Find sudoers.d configuration files
      ansible.builtin.find:
        paths: /etc/sudoers.d
        file_type: file
        recurse: false
        excludes: '*~'
      register: sudoers_d_files

    - name: Remove !use_pty from sudoers.d files
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^(\s*Defaults\s+[^#\n\r]*)!use_pty\b'
        replace: '\1'
        backup: true
      loop: "{{ sudoers_d_files.files }}"
      failed_when: false

    - name: Create CIS sudo use_pty configuration
      ansible.builtin.copy:
        dest: /etc/sudoers.d/99-cis-use-pty
        owner: root
        group: root
        mode: '0440'
        content: |
          # CIS 5.2.2
          # Ensure sudo commands use pty
          Defaults use_pty
        validate: '/usr/sbin/visudo -cf %s'

    - name: Validate complete sudoers configuration
      ansible.builtin.command:
        cmd: /usr/sbin/visudo -c
      register: sudoers_validation
      changed_when: false

    - name: Check sudo use_pty configuration
      ansible.builtin.shell: |
        grep -rPi '^\h*Defaults\h+([^#\n\r]+,\h*)?use_pty\b' \
          /etc/sudoers /etc/sudoers.d/* 2>/dev/null
      register: use_pty_check
      changed_when: false
      failed_when: false

    - name: Check for !use_pty configuration
      ansible.builtin.shell: |
        if grep -rPi '^\h*Defaults\h+([^#\n\r]+,\h*)?\!use_pty\b' \
          /etc/sudoers /etc/sudoers.d/* 2>/dev/null; then
          exit 1
        else
          exit 0
        fi
      register: no_disable_pty_check
      changed_when: false
      failed_when: false

    - name: Assert CIS 5.2.2 compliance
      ansible.builtin.assert:
        that:
          - use_pty_check.rc == 0
          - no_disable_pty_check.rc == 0
          - sudoers_validation.rc == 0
        success_msg: "CIS 5.2.2 compliant - sudo commands use pty"
        fail_msg: "CIS 5.2.2 failed - sudo use_pty configuration is not compliant"
