---
- name: CIS 5.3.3.2.7 - Ensure password quality is enforced for the root user
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Create pwquality configuration for root user
      ansible.builtin.copy:
        dest: /etc/security/pwquality.conf.d/50-pwroot.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # CIS 5.3.3.2.7
          # Enforce password quality requirements for root
          enforce_for_root
      notify: Validate pwquality configuration

    - name: Verify enforce_for_root configuration
      ansible.builtin.shell: |
        grep -RinE '^[[:space:]]*enforce_for_root[[:space:]]*$' \
          /etc/security/pwquality.conf \
          /etc/security/pwquality.conf.d/*.conf 2>/dev/null
      register: enforce_for_root_check
      changed_when: false
      failed_when: false

    - name: Display enforce_for_root configuration
      ansible.builtin.debug:
        var: enforce_for_root_check.stdout_lines

    - name: Assert CIS 5.3.3.2.7 compliance
      ansible.builtin.assert:
        that:
          - enforce_for_root_check.rc == 0
          - enforce_for_root_check.stdout_lines | length >= 1
        success_msg: "CIS 5.3.3.2.7 compliant - password quality is enforced for root"
        fail_msg: "CIS 5.3.3.2.7 failed - enforce_for_root is not configured"

  handlers:

    - name: Validate pwquality configuration
      ansible.builtin.command:
        cmd: pwscore
      changed_when: false
      failed_when: false
